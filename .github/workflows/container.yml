name: Build and smoke-test website
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Check daily dates, archive and repository section
        run: python3 -m unittest discover -s tests
      - name: Build Docker image
        run: docker build -t weekly-news:ci .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser for PWA verification
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          google-chrome --version
      - name: Verify the served site
        run: |
          set -eu
          docker run -d --name weekly-news -p 127.0.0.1:8080:8080 weekly-news:ci
          trap 'docker logs weekly-news; docker rm -f weekly-news' EXIT
          base=http://127.0.0.1:8080
          curl --retry 12 --retry-all-errors --retry-delay 1 --max-time 4 -fsS "$base/healthz"
          curl -fsS "$base/" -o /tmp/weekly-home.html
          grep -q 'id="research"' /tmp/weekly-home.html
          curl -fsS "$base/archive/" -o /tmp/weekly-archive.html
          grep -q '/issues/' /tmp/weekly-archive.html
          curl -fsS "$base/assets/vazirmatn.woff2" -o /dev/null
          node tests/pwa-browser.cjs
          if [ -d content/previews ]; then
            for preview in content/previews/*.md; do
              [ -f "$preview" ] || continue
              slug=$(basename "$preview" .md)
              curl -fsS "$base/previews/$slug/" -o /tmp/daily-preview.html
              grep -q 'id="github"' /tmp/daily-preview.html
              grep -q 'نسخهٔ آزمایشی روزانه' /tmp/daily-preview.html
            done
          fi
